name: Production backup pre-0003
run-name: Backup pre-0003 · ${{ github.run_id }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-backup-pre-0003
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require private repository before accessing production
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const {data: repo} = await github.rest.repos.get(context.repo);
            if (!repo.private) {
              core.setFailed('Production backup requires a private repository. No database access permitted.');
            }

      - name: Install PostgreSQL 18 client from PGDG
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/cognova-pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends postgresql-client-18
          /usr/lib/postgresql/18/bin/pg_dump --version
          /usr/lib/postgresql/18/bin/pg_restore --version

      - name: Create and verify custom-format backup
        id: backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import parse_qsl, urlsplit

          def run(args, env):
              result = subprocess.run(args, env=env, capture_output=True, timeout=600)
              if result.returncode:
                  # Never print native errors: they can contain connection details.
                  raise RuntimeError('PostgreSQL operation failed; no artifact published')
              return result.stdout

          def backup():
              raw = os.environ.get('DATABASE_URL', '')
              if not raw:
                  raise ValueError('Required database secret is unavailable')
              url = raw.replace('postgresql+psycopg://', 'postgresql://', 1)
              parsed = urlsplit(url)
              if (parsed.scheme not in ('postgresql', 'postgres')
                  or not parsed.hostname
                  or parsed.hostname.split('.')[0] != 'dpg-db2iojc9v7es7387i2ig-a'
                  or not parsed.hostname.endswith('.render.com')
                  or parsed.path != '/cognova' or parsed.fragment):
                  raise ValueError('Unexpected database target')
              options = parse_qsl(parsed.query, keep_blank_values=True)
              if any(k not in ('sslmode', 'channel_binding', 'connect_timeout') for k, _ in options):
                  raise ValueError('Unsupported connection options')
              if any(k == 'sslmode' and v not in ('require', 'verify-ca', 'verify-full') for k, v in options):
                  raise ValueError('TLS is required')
              env = {k: v for k, v in os.environ.items()
                     if not k.startswith('PG') and k != 'DATABASE_URL'}
              env.update(PGDATABASE=url, PGSSLMODE='require', PGCONNECT_TIMEOUT='15',
                         PGOPTIONS='-c default_transaction_read_only=on -c statement_timeout=120000 -c lock_timeout=15000')
              binaries = Path('/usr/lib/postgresql/18/bin')
              psql = [str(binaries / 'psql'), '--no-psqlrc', '--no-password', '-At', '-v', 'ON_ERROR_STOP=1', '-c']
              revision = run(psql + ['SELECT version_num FROM public.alembic_version ORDER BY version_num'], env).decode().strip()
              if revision != '0002_auth_sessions':
                  raise ValueError('Expected exactly revision 0002 before backup')
              if run(psql + ['SELECT ssl FROM pg_stat_ssl WHERE pid=pg_backend_pid()'], env).strip() != b't':
                  raise ValueError('TLS session could not be verified')
              dump_version = run([str(binaries / 'pg_dump'), '--version'], env).decode().strip()
              restore_version = run([str(binaries / 'pg_restore'), '--version'], env).decode().strip()
              if not dump_version.startswith('pg_dump (PostgreSQL) 18.'):
                  raise ValueError('PostgreSQL client 18 required')
              destination = Path(os.environ['RUNNER_TEMP']) / 'cognova-pre-0003'
              destination.mkdir(mode=0o700, exist_ok=False)
              dump = destination / 'cognova-pre-0003.dump'
              started = datetime.now(timezone.utc).isoformat()
              run([str(binaries / 'pg_dump'), '--no-password', '--format=custom',
                   '--lock-wait-timeout=15s', '--file', str(dump)], env)
              if dump.stat().st_size == 0:
                  raise ValueError('Empty backup')
              toc = run([str(binaries / 'pg_restore'), '--list', str(dump)], env)
              for table in ('users', 'auth_sessions', 'rate_limit_buckets', 'alembic_version'):
                  if f'TABLE DATA public {table} '.encode() not in toc:
                      raise ValueError('Required table data missing from backup')
              # Decode the complete archive, without connecting or executing SQL.
              run([str(binaries / 'pg_restore'), '--file=/dev/null', str(dump)], env)
              if run(psql + ['SELECT version_num FROM public.alembic_version ORDER BY version_num'], env).decode().strip() != revision:
                  raise ValueError('Schema revision changed during backup')
              with dump.open('rb') as stream:
                  digest = hashlib.file_digest(stream, 'sha256').hexdigest()
              manifest = dict(
                  file=dump.name, format='custom', size_bytes=dump.stat().st_size,
                  sha256=digest, started_at_utc=started,
                  verified_at_utc=datetime.now(timezone.utc).isoformat(),
                  pg_dump_version=dump_version, pg_restore_version=restore_version,
                  revision_before=revision, revision_after=revision,
                  pg_restore_list='passed', full_archive_decode='passed',
                  restore_rehearsal='not_performed',
                  run_id=os.environ['GITHUB_RUN_ID'], attempt=os.environ['GITHUB_RUN_ATTEMPT'],
                  source_commit=os.environ['GITHUB_SHA'],
              )
              (destination / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
              (destination / 'SHA256SUMS').write_text(f'{digest}  {dump.name}\n')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write(f'directory={destination}\n')
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('### Verified pre-0003 backup\n```json\n' + json.dumps(manifest, indent=2) + '\n```\n')
              print(json.dumps(manifest))

          try:
              backup()
          except Exception as error:
              print('::error::Backup stopped; exception_type=' + type(error).__name__)
              raise SystemExit(1) from None
          PY

      - name: Recheck privacy before uploading production data
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const {data: repo} = await github.rest.repos.get(context.repo);
            if (!repo.private) core.setFailed('Repository is no longer private; upload prohibited.');

      - name: Upload verified private pre-0003 backup
        uses: actions/upload-artifact@v4
        with:
          name: cognova-production-pre-0003-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.backup.outputs.directory }}/cognova-pre-0003.dump
            ${{ steps.backup.outputs.directory }}/manifest.json
            ${{ steps.backup.outputs.directory }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Remove runner-local backup files
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/cognova-pre-0003"
