name: Database checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cognova_test
          POSTGRES_PASSWORD: ci-only-ephemeral-password
          POSTGRES_DB: cognova_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cognova_test -d cognova_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://cognova_test:ci-only-ephemeral-password@localhost:5432/cognova_test
      TEST_DATABASE_ALLOW_DDL: 'yes'
      REQUIRE_POSTGRES_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip check
      - run: python -m ruff check cognova_database migrations scripts tests
      - run: python -m ruff format --check cognova_database migrations scripts tests
      - run: python -m pytest -q --junitxml=artifacts/test-results.xml
      - run: python scripts/check_test_results.py artifacts/test-results.xml
      - run: python -m cognova_database heads
      - run: python -m cognova_database upgrade head --sql > artifacts/schema.sql
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-validation
          path: artifacts/
